name: Build Signed Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build Signed Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle Build Environment
        uses: gradle/actions/setup-gradle@v3

      - name: Decode Cryptographic Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            echo "Decoding debug.keystore from base64 encoding..."
            base64 -d debug.keystore.base64 > debug.keystore || base64 --decode debug.keystore.base64 > debug.keystore
          else
            echo "WARNING: debug.keystore.base64 not found in root. Generating mock keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Decode Release Keystore (if secret is configured)
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' }}
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "Decoding release keystore..."
          if echo "$RELEASE_KEYSTORE_BASE64" | tr -d '\r\n\t ' | base64 -d > app/my-upload-key.jks 2>/dev/null || \
             echo "$RELEASE_KEYSTORE_BASE64" | tr -d '\r\n\t ' | base64 --decode > app/my-upload-key.jks 2>/dev/null || \
             python3 -c "import base64, os; open('app/my-upload-key.jks', 'wb').write(base64.b64decode(os.environ['RELEASE_KEYSTORE_BASE64'].strip()))" 2>/dev/null; then
            echo "Successfully decoded release keystore."
          else
            echo "WARNING: RELEASE_KEYSTORE_BASE64 secret contains invalid base64 characters. Skipping release key file..."
            rm -f app/my-upload-key.jks
          fi

      - name: Compile and Build Signed Release APK
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PATH: app/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "Compiling Release Signed APK..."
          gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Upload Signed Installable Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Automatic-Flood-Alert-System-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
