name: Build Signed Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build Signed Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle Build Environment
        uses: gradle/actions/setup-gradle@v3

      - name: Decode Cryptographic Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            echo "Decoding debug.keystore from base64 encoding..."
            base64 -d debug.keystore.base64 > debug.keystore || base64 --decode debug.keystore.base64 > debug.keystore
          else
            echo "WARNING: debug.keystore.base64 not found in root. Generating mock keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Compile and Build Signed APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload Signed Installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Workbee-Automatic-Flood-Alert-Signed-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
